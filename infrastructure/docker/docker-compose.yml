name: Car Rental 

services:
  backend:
    build: .
    image: backend
    container_name: backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend

  frontend:
    build: .
    image: frontend
    container_name: frontend
  postgres:
    image: postgres:17
    container_name: postgres 
    ports:
      - "5434:5432"
    env_file: ./backend

  redis:
    image: redis:12
    container_name: redis 
    ports:
      - "1111:1111"
    env_file: ./backend
